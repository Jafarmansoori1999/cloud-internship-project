<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Auth - Login & Signup</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
    .auth-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
    .auth-container h2 { text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button:hover { background: #0056b3; }
    .toggle-btn { background: transparent; color: #007bff; margin-top: 10px; }
    .error-msg { color: red; font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="auth-container">
  <h2 id="form-title">Login</h2>
  <form id="auth-form">
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" id="submit-btn">Login</button>
  </form>
  
  <button type="button" class="toggle-btn" id="toggle-btn">Need an account? Sign Up</button>
  <div id="error-message" class="error-msg"></div>
</div>

<script type="module" src="./auth.js"></script>
</body>
</html>
